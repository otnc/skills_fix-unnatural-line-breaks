name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run lint.mjs test suite
        run: npm test

  self-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # lint.mjs never fails on findings (they're suggestions, not verdicts — see SKILL.md), so this step is informational only: it surfaces regressions in the skill's own docs and comments without blocking CI.
      # Covers everything with prose or comments in the repo (the file list lives in scripts/lint-self.mjs): docs, the README base file, the scripts and tests themselves (# and // comments), and the workflow files (# comments).
      - name: Self-lint prose for unnatural line breaks
        run: npm run lint:self

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # kiritan needs Node.js 22.7+.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check that README.md and README.ja.md match base/README.base.md
        run: npm run docs:verify

      - name: Check translations for missing or stale sections
        run: npm run docs:check

  skills-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check that the skills CLI finds the skill
        run: npx --yes skills add . --list | grep -q fix-unnatural-line-breaks
